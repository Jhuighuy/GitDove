name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud
    # Repository secrets are unavailable to pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Scan and check quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true

  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Prove Sparkle update and tamper rejection without an Apple certificate
        if: runner.os == 'macOS'
        run: npm run test:updates
      - name: Release version
        id: version
        run: node scripts/release.mjs version
      - name: Package distributions
        shell: bash
        run: npm run package -- --${{ matrix.platform }} --${{ matrix.arch }} "-c.extraMetadata.version=${{ steps.version.outputs.version }}"
      - name: Prove packaged GitDove restart and update
        if: runner.os == 'macOS'
        run: npm run test:updates:electron -- release/${{ steps.version.outputs.version }}
      - name: Save tested distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          overwrite: true
          path: |
            release/*/*.AppImage
            release/*/*.deb
            release/*/*.exe
            release/*/*.dmg
            release/*/*.zip
            release/*/*.blockmap
            release/*/latest*.yml
      - name: Save Sparkle proof
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: update-proof-${{ matrix.arch }}
          overwrite: true
          path: out/update-proof/

  release-check:
    name: Release package validation
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          pattern: packages-*
          path: out/release-artifacts
      - run: node scripts/release.mjs validate out/release-artifacts
