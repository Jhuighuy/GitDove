name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: macos-latest
    concurrency:
      group: release-publication
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    env:
      GITDOVE_BUILD_NUMBER: ${{ github.event.workflow_run.run_number }}
      GITDOVE_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download packages from the successful main CI run
        uses: actions/download-artifact@v5
        with:
          pattern: packages-*
          path: out/release-artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify packages and sign macOS updates
        run: node scripts/release.mjs stage out/release-artifacts out/publish
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      - name: Publish the complete release
        run: node scripts/release.mjs publish out/publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
