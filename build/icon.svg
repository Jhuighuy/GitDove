<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- GitDove app icon. Source of truth; run `npm run icons` after editing. -->
  <!-- Canvas follows the macOS grid: an 824px tile centered on a 1024px canvas. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12b886"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="far-wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="4"/>
  <g transform="translate(100 100) scale(5.885714) translate(4 4)">
    <!-- Far wing, peeking out behind the body. -->
    <g fill="url(#far-wing)">
      <ellipse cx="65.1" cy="36.0" rx="23.5" ry="4.6" transform="rotate(-77.9 65.1 36.0)"/>
      <ellipse cx="69.7" cy="34.8" rx="26.0" ry="4.6" transform="rotate(-66.6 69.7 34.8)"/>
      <ellipse cx="74.3" cy="36.1" rx="27.1" ry="4.6" transform="rotate(-54.7 74.3 36.1)"/>
    </g>
    <!-- Body and tail. -->
    <path d="M37 61 C36 54 39 48 45 48 C51 48 56 51 59 56 C66 60 76 63 84 64 C96 66 110 64 124 61 C124 65 122 67 119 69 C122 70 125 71 125 74 C124 77 122 78 119 78 C121 80 122 82 122 85 C108 88 96 88 86 86 C72 88 58 86 50 78 C45 73 41 68 37 64 Z" fill="#ffffff"/>
    <!-- Near wing: fanned primaries under a covert layer. -->
    <g fill="#ffffff">
      <ellipse cx="81.8" cy="37.6" rx="29.8" ry="5.6" transform="rotate(-52.3 81.8 37.6)"/>
      <ellipse cx="85.4" cy="42.3" rx="29.0" ry="5.6" transform="rotate(-39.0 85.4 42.3)"/>
      <ellipse cx="86.2" cy="47.9" rx="26.6" ry="5.6" transform="rotate(-26.6 86.2 47.9)"/>
      <ellipse cx="84.1" cy="53.0" rx="22.7" ry="5.6" transform="rotate(-15.4 84.1 53.0)"/>
      <ellipse cx="80.0" cy="57.1" rx="18.0" ry="5.6" transform="rotate(-3.6 80.0 57.1)"/>
    </g>
    <path d="M56 57 C62 46 72 38 82 34 C87 40 87 49 82 57 C76 62 66 62 56 57 Z" fill="#ffffff"/>
    <g fill="none" stroke-linecap="round">
      <path d="M92 77 C100 78 108 78 116 76" stroke="#d1fae5" stroke-width="1.3"/>
    </g>
    <circle cx="46" cy="55" r="2.8" fill="#065f46"/>
    <!-- Olive branch: a line of commits. -->
    <path d="M31.5 62 C26 75 23 88 25 106" fill="none" stroke="#064e3b" stroke-width="4" stroke-linecap="round"/>
    <!-- Beak, drawn over the branch so it holds it. -->
    <path d="M40.5 58.6 C37 59.8 34 60.7 31 61.5 C33.6 62.6 37 62.7 40.5 61.7 Z" fill="#e07b39"/>
    <path d="M41 51.8 C37 52.8 32.8 55.8 28.6 60.3 C32 60.3 36.4 59.4 40.6 58.5 Z" fill="#f6ad6b"/>
    <ellipse cx="39.3" cy="54.1" rx="1.7" ry="1.1" fill="#fcd5ae" transform="rotate(-28 39.3 54.1)"/>
    <ellipse cx="19" cy="73" rx="7.5" ry="3.6" fill="#bbf7d0" transform="rotate(-40 19 73)"/>
    <ellipse cx="34" cy="88" rx="7.5" ry="3.6" fill="#bbf7d0" transform="rotate(35 34 88)"/>
    <ellipse cx="16" cy="98" rx="7.5" ry="3.6" fill="#bbf7d0" transform="rotate(-30 16 98)"/>
    <circle cx="28" cy="74" r="5" fill="#064e3b"/>
    <circle cx="24" cy="89" r="5" fill="#064e3b"/>
    <circle cx="25" cy="106" r="5" fill="#064e3b"/>
  </g>
</svg>
