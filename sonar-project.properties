sonar.projectKey=Jhuighuy_GitDove
sonar.organization=jhuighuy
sonar.host.url=https://sonarcloud.io

sonar.sources=src,scripts
sonar.tests=src,scripts
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,scripts/**/*.test.mjs
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,scripts/**/*.test.mjs
# Build and release tooling; the macOS packaging jobs exercise it end to end (docs/updates.md).
sonar.coverage.exclusions=scripts/**
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Ignored findings. Prefer fixing code; ignore a rule here only when it does not fit the project,
# with the reason next to it.
sonar.issue.ignore.multicriteria=ui,ts4036,js4036,s6759,s3358,s3776,s3735,s7780,s6564,s7785,a11y1,a11y2,a11y3,a11y4,a11y5,a11y6,worker,csp
# Generated shadcn components (CLAUDE.md: do not hand-edit them heavily).
sonar.issue.ignore.multicriteria.ui.ruleKey=*
sonar.issue.ignore.multicriteria.ui.resourceKey=src/renderer/src/components/ui/**
# A desktop app runs the user's own ssh, git and terminal from their PATH by design.
sonar.issue.ignore.multicriteria.ts4036.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.ts4036.resourceKey=**/*
sonar.issue.ignore.multicriteria.js4036.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.js4036.resourceKey=**/*
# Read-only props: the types are not shared mutable state; marking every prop adds only noise.
sonar.issue.ignore.multicriteria.s6759.ruleKey=typescript:S6759
sonar.issue.ignore.multicriteria.s6759.resourceKey=**/*
# Nested ternaries: formatted by oxfmt and idiomatic in JSX.
sonar.issue.ignore.multicriteria.s3358.ruleKey=typescript:S3358
sonar.issue.ignore.multicriteria.s3358.resourceKey=**/*
# Cognitive complexity: the flagged functions are single-pass parsers and hot loops kept flat on
# purpose; they are covered by tests.
sonar.issue.ignore.multicriteria.s3776.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.s3776.resourceKey=**/*
# `void promise` marks intentionally unawaited promises.
sonar.issue.ignore.multicriteria.s3735.ruleKey=typescript:S3735
sonar.issue.ignore.multicriteria.s3735.resourceKey=**/*
# String.raw: escape tables read better escaped, and shell scripts use String.raw defensively.
sonar.issue.ignore.multicriteria.s7780.ruleKey=typescript:S7780
sonar.issue.ignore.multicriteria.s7780.resourceKey=**/*
# Named string aliases (e.g. RepoId) document intent.
sonar.issue.ignore.multicriteria.s6564.ruleKey=typescript:S6564
sonar.issue.ignore.multicriteria.s6564.resourceKey=**/*
# The main process starts from Electron's lifecycle; top-level await would not simplify it.
sonar.issue.ignore.multicriteria.s7785.ruleKey=typescript:S7785
sonar.issue.ignore.multicriteria.s7785.resourceKey=src/main/index.ts
# Lists, rows and the tab strip are mouse targets like native desktop list views; keyboard
# navigation is handled by their containers.
sonar.issue.ignore.multicriteria.a11y1.ruleKey=typescript:S1082
sonar.issue.ignore.multicriteria.a11y1.resourceKey=src/renderer/**
sonar.issue.ignore.multicriteria.a11y2.ruleKey=typescript:S6847
sonar.issue.ignore.multicriteria.a11y2.resourceKey=src/renderer/**
sonar.issue.ignore.multicriteria.a11y3.ruleKey=typescript:S6848
sonar.issue.ignore.multicriteria.a11y3.resourceKey=src/renderer/**
sonar.issue.ignore.multicriteria.a11y4.ruleKey=typescript:S6845
sonar.issue.ignore.multicriteria.a11y4.resourceKey=src/renderer/**
sonar.issue.ignore.multicriteria.a11y5.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.a11y5.resourceKey=src/renderer/**
sonar.issue.ignore.multicriteria.a11y6.ruleKey=typescript:S6852
sonar.issue.ignore.multicriteria.a11y6.resourceKey=src/renderer/**
# Dedicated workers only receive messages from the page that created them; there is no origin.
sonar.issue.ignore.multicriteria.worker.ruleKey=typescript:S2819
sonar.issue.ignore.multicriteria.worker.resourceKey=**/*.worker.ts
# Renderer CSP: the toast and theme libraries inject <style> elements; scripts stay 'self'.
sonar.issue.ignore.multicriteria.csp.ruleKey=Web:S7039
sonar.issue.ignore.multicriteria.csp.resourceKey=src/renderer/index.html
