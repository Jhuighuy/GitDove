appId: dev.gitdove.app
productName: GitDove
copyright: Copyright © 2026 Oleg Butakov
# Uses the static macOS icon when Xcode 26+ is unavailable on the build machine.
beforePack: scripts/before-pack.mjs
# Embeds the Sparkle updater into macOS builds.
afterPack: scripts/after-pack.mjs
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  # Runtime assets referenced by path (window icon).
  - resources/**
  # Native file watcher binaries cannot be loaded from inside the asar archive.
  - node_modules/@parcel/watcher*/**
publish:
  provider: github
  owner: Jhuighuy
  repo: GitDove
  releaseType: release
mac:
  # beforePack selects build/icon.icns if the Icon Composer compiler is unavailable.
  icon: build/Fold.icon
  minimumSystemVersion: "26.0"
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # Apple silicon only. The zip is what Sparkle downloads for over-the-air updates.
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  # Ad-hoc signed: no Apple Developer ID, so no notarization and no use for the hardened runtime.
  # Sparkle authenticates updates with our Ed25519 key instead (docs/updates.md).
  identity: "-"
  hardenedRuntime: false
  notarize: false
linux:
  icon: build/icons
  category: Development
  target: [AppImage, deb]
  maintainer: Oleg Butakov <butakovoleg@gmail.com>
win:
  icon: build/icon.ico
  target: [nsis]
nsis:
  oneClick: true
  perMachine: false
