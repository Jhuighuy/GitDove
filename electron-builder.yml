appId: dev.gitdove.app
productName: GitDove
copyright: Copyright © 2026 Oleg Butakov
# Uses the static macOS icon when Xcode 26+ is unavailable on the build machine.
beforePack: scripts/before-pack.mjs
# Embeds the Sparkle updater into macOS builds.
afterPack: scripts/after-pack.mjs
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
  # Source maps stay out of the installers (ours are emitted for local debugging only).
  - "!**/*.map"
  # @parcel/watcher loads the N-API prebuild from @parcel/watcher-<platform>; its C++ sources and
  # any local build are dead weight.
  - "!node_modules/@parcel/watcher/{src,scripts,build}/**"
  - "!node_modules/@parcel/watcher/binding.gyp"
asarUnpack:
  # Runtime assets referenced by path (window icon).
  - resources/**
  # Native file watcher binaries cannot be loaded from inside the asar archive.
  - node_modules/@parcel/watcher-*/**
# The only native dependency, @parcel/watcher, ships N-API prebuilds that work in any Electron.
# Rebuilding compiled it from source on every package run (40 s) and the result went unused.
npmRebuild: false
# Lock down the Electron binary: without these, any local process could run GitDove as plain Node
# (ELECTRON_RUN_AS_NODE, NODE_OPTIONS, --inspect) and inherit its macOS privacy grants, or swap the
# app code next to the asar. Cookie encryption stays off: GitDove keeps no cookies worth it, and
# with an ad-hoc signature the Keychain would prompt after every update.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
publish:
  provider: github
  owner: Jhuighuy
  repo: GitDove
  releaseType: release
mac:
  # beforePack selects build/icon.icns if the Icon Composer compiler is unavailable.
  icon: build/Fold.icon
  minimumSystemVersion: "26.0"
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # Apple silicon only. The zip is what Sparkle downloads for over-the-air updates.
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  # Ad-hoc signed: no Apple Developer ID, so no notarization and no use for the hardened runtime.
  # Sparkle authenticates updates with our Ed25519 key instead (docs/updates.md).
  identity: "-"
  hardenedRuntime: false
  notarize: false
dmg:
  # The 640×420 background defines the Finder canvas. electron-builder combines
  # its @2x sibling into a Retina TIFF; coordinates below stay in 1× points.
  background: build/dmg-background.png
  # Use the committed ICNS for the volume, independently of Icon Composer.
  icon: build/icon.icns
  iconSize: 112
  iconTextSize: 14
  window:
    width: 640
    height: 420
  contents:
    # Omitting path lets electron-builder use the app from this build.
    - x: 176
      y: 236
      type: file
    - x: 464
      y: 236
      type: link
      path: /Applications
linux:
  icon: build/icons
  category: Development
  target: [AppImage, deb]
  maintainer: Oleg Butakov <butakovoleg@gmail.com>
win:
  icon: build/icon.ico
  target: [nsis]
nsis:
  # The default name has spaces, which GitHub turns into dots on upload, while latest.yml points
  # at a dashed name: updates would 404. `release.mjs check` guards against such mismatches.
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: true
  perMachine: false
