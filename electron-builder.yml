appId: dev.gitdove.app
productName: GitDove
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
afterPack: scripts/after-pack.mjs
copyright: Copyright © 2026 Oleg Butakov
directories:
  output: release/${version}
  buildResources: build
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - resources/**
  - package.json
asarUnpack:
  # Runtime assets referenced by path (window icon).
  - resources/**
  # Native file watcher binaries cannot be loaded from inside the asar archive.
  - node_modules/@parcel/watcher*/**
publish:
  provider: github
  owner: Jhuighuy
  repo: GitDove
  releaseType: release
mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  target:
    - dmg
    # Sparkle downloads the ZIP; the DMG is for the first installation.
    - zip
  hardenedRuntime: true
  identity: "-"
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  minimumSystemVersion: "13.0"
  # Ad-hoc signing needs no Apple certificate. Sparkle verifies our Ed25519 signatures.
  notarize: false
linux:
  icon: build/icons
  category: Development
  target: [AppImage, deb]
  maintainer: Oleg Butakov <butakovoleg@gmail.com>
win:
  icon: build/icon.ico
  target: [nsis]
nsis:
  oneClick: true
  perMachine: false
